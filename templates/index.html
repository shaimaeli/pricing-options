<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Options Pricer</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
      margin: 0;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #ddd;
      padding: 15px 30px;
    }

    h1 { font-size: 20px; margin: 0; }
    h2 { font-size: 15px; margin: 0 0 10px 0; }
    h3 { font-size: 14px; margin: 25px 0 10px 0; }

    main {
      padding: 20px;
    }

    .carte {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .ligne {
      display: flex;
      gap: 20px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    label { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }

    input {
      padding: 6px;
      width: 100px;
      border: 1px solid #bbb;
      border-radius: 3px;
    }

    button {
      background: #2c5282;
      color: #fff;
      border: none;
      border-radius: 3px;
      padding: 8px 16px;
      cursor: pointer;
    }
    button:hover { background: #234469; }

    /* Barre d'onglets */
    nav { display: flex; gap: 4px; margin-bottom: 15px; }
    nav button { background: #e2e5ea; color: #333; }
    nav button.actif { background: #2c5282; color: #fff; }

    /* Contenu des onglets */
    .onglet {
      display: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 15px;
    }
    .onglet.actif { display: block; }

    table { border-collapse: collapse; margin-top: 15px; width: 100%; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e5e5e5; font-size: 13px; }
    th { background: #f4f5f7; }

    .graphique { height: 300px; }
  </style>
</head>

<body>

  <header>
    <h1>Options Pricer</h1>
  </header>

  <main>

    <section class="carte">
      <h2>Données de marché</h2>
      <div class="ligne">
        <label>Ticker <input id="ticker" value="AAPL"></label>
        <button id="btn-ticker">Charger</button>
        <span id="info-ticker"></span>
      </div>
    </section>

    <section class="carte">
      <h2>Paramètres</h2>
      <div class="ligne">
        <label>S₀ <input id="s0" type="number" value="100"></label>
        <label>Strike K <input id="k" type="number" value="100"></label>
        <label>Maturité T (ans) <input id="t" type="number" value="1" step="0.1"></label>
        <label>Taux r <input id="r" type="number" value="0.05" step="0.01"></label>
        <label>Volatilité σ <input id="sigma" type="number" value="0.2" step="0.01"></label>
      </div>
    </section>

    <nav>
      <button data-onglet="prix" class="actif">Black-Scholes / Monte Carlo</button>
      <button data-onglet="convergence">Convergence</button>
      <button data-onglet="ml">ML Pricer</button>
    </nav>

    <!-- Onglet 1 : prix -->
    <section id="prix" class="onglet actif">
      <button id="btn-prix">Calculer</button>

      <table>
        <tr><th>Méthode</th><th>Call</th><th>Put</th></tr>
        <tr><td>Black-Scholes</td><td id="bs-call">-</td><td id="bs-put">-</td></tr>
        <tr><td>Monte Carlo</td><td id="mc-call">-</td><td id="mc-put">-</td></tr>
      </table>

      <h3>Payoff à l'échéance</h3>
      <div class="graphique"><canvas id="graph-payoff"></canvas></div>

      <h3>Distribution des prix terminaux (Monte Carlo)</h3>
      <div class="graphique"><canvas id="graph-histogramme"></canvas></div>
    </section>

    <!-- Onglet 2 : convergence -->
    <section id="convergence" class="onglet">
      <button id="btn-convergence">Calculer la convergence</button>

      <table id="table-convergence"></table>

      <h3>Erreur forte : Euler vs Milstein</h3>
      <div class="graphique"><canvas id="graph-convergence"></canvas></div>
    </section>

    <!-- Onglet 3 : machine learning -->
    <section id="ml" class="onglet">
      <button id="btn-entrainer">Entraîner le modèle</button>
      <span id="info-rmse"></span>
      <br><br>
      <button id="btn-predire">Prédire avec les paramètres ci-dessus</button>

      <table>
        <tr><th>Méthode</th><th>Call</th><th>Put</th></tr>
        <tr><td>ML (Gradient Boosting)</td><td id="ml-call">-</td><td id="ml-put">-</td></tr>
        <tr><td>Black-Scholes</td><td id="ml-bs-call">-</td><td id="ml-bs-put">-</td></tr>
      </table>
    </section>

  </main>

  <script>
    // ================= Utilitaires =================

    const graphiques = {};   // garde les graphiques pour pouvoir les remplacer

    function valeur(id) {
      return parseFloat(document.getElementById(id).value);
    }

    function lireParametres() {
      return {
        s0: valeur("s0"),
        k: valeur("k"),
        t: valeur("t"),
        r: valeur("r"),
        sigma: valeur("sigma"),
      };
    }

    async function appelerApi(url, donnees) {
      const reponse = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(donnees),
      });
      return reponse.json();
    }

    function ecrire(id, nombre, decimales = 4) {
      document.getElementById(id).textContent = nombre.toFixed(decimales);
    }

    function dessiner(idCanvas, type, labels, datasets) {
      if (graphiques[idCanvas]) {
        graphiques[idCanvas].destroy();
      }
      graphiques[idCanvas] = new Chart(document.getElementById(idCanvas), {
        type: type,
        data: { labels: labels, datasets: datasets },
        options: { responsive: true, maintainAspectRatio: false },
      });
    }


    // ================= Onglets =================

    function afficherOnglet(nom) {
      document.querySelectorAll(".onglet").forEach(onglet => {
        onglet.classList.toggle("actif", onglet.id === nom);
      });
      document.querySelectorAll("nav button").forEach(bouton => {
        bouton.classList.toggle("actif", bouton.dataset.onglet === nom);
      });
    }

    document.querySelectorAll("nav button").forEach(bouton => {
      bouton.addEventListener("click", () => afficherOnglet(bouton.dataset.onglet));
    });


    // ================= Ticker =================

    async function chargerTicker() {
      const symbole = document.getElementById("ticker").value;
      const info = document.getElementById("info-ticker");

      const reponse = await fetch("/api/ticker?ticker=" + symbole);
      const donnees = await reponse.json();

      if (!reponse.ok) {
        info.textContent = donnees.error;
        return;
      }

      document.getElementById("s0").value = donnees.prix.toFixed(2);
      document.getElementById("k").value = Math.round(donnees.prix);
      document.getElementById("sigma").value = donnees.volatilite.toFixed(3);
      info.textContent = "Prix : " + donnees.prix.toFixed(2)
        + " | Volatilité historique : " + (donnees.volatilite * 100).toFixed(1) + " %";
    }


    // ================= Onglet 1 : Black-Scholes / Monte Carlo =================

    function dessinerPayoff(params) {
      const prix = [], payoffCall = [], payoffPut = [];
      const pas = params.s0 / 50;

      for (let s = params.s0 * 0.5; s <= params.s0 * 1.5; s += pas) {
        prix.push(s.toFixed(0));
        payoffCall.push(Math.max(s - params.k, 0));
        payoffPut.push(Math.max(params.k - s, 0));
      }

      dessiner("graph-payoff", "line", prix, [
        { label: "Call", data: payoffCall, borderColor: "#2f855a", pointRadius: 0 },
        { label: "Put", data: payoffPut, borderColor: "#c53030", pointRadius: 0 },
      ]);
    }

    async function calculerPrix() {
      const params = lireParametres();
      const resultat = await appelerApi("/api/prix", params);

      ecrire("bs-call", resultat.bs_call);
      ecrire("bs-put", resultat.bs_put);
      ecrire("mc-call", resultat.mc_call);
      ecrire("mc-put", resultat.mc_put);

      dessinerPayoff(params);
      dessiner("graph-histogramme", "bar", resultat.hist_x, [
        { label: "Fréquence", data: resultat.hist_y, backgroundColor: "#2c5282" },
      ]);
    }


    // ================= Onglet 2 : Convergence =================

    async function calculerConvergence() {
      const lignes = await appelerApi("/api/convergence", lireParametres());

      let html = `<tr>
        <th>N</th><th>Faible Euler</th><th>Faible Milstein</th>
        <th>Forte Euler</th><th>Forte Milstein</th></tr>`;

      lignes.forEach(ligne => {
        html += `<tr>
          <td>${ligne.N}</td>
          <td>${ligne.faible_euler.toFixed(4)}</td>
          <td>${ligne.faible_milstein.toFixed(4)}</td>
          <td>${ligne.forte_euler.toFixed(4)}</td>
          <td>${ligne.forte_milstein.toFixed(4)}</td>
        </tr>`;
      });
      document.getElementById("table-convergence").innerHTML = html;

      dessiner("graph-convergence", "line", lignes.map(l => l.N), [
        { label: "Euler", data: lignes.map(l => l.forte_euler), borderColor: "#c05621" },
        { label: "Milstein", data: lignes.map(l => l.forte_milstein), borderColor: "#2c5282" },
      ]);
    }


    // ================= Onglet 3 : ML =================

    async function entrainerModele() {
      const info = document.getElementById("info-rmse");
      info.textContent = "Entraînement en cours...";

      const rmse = await appelerApi("/api/ml/entrainer", {});
      info.textContent = "RMSE call : " + rmse.call.toFixed(4)
        + " | RMSE put : " + rmse.put.toFixed(4);
    }

    async function predireModele() {
      const resultat = await appelerApi("/api/ml/predire", lireParametres());

      if (resultat.error) {
        alert(resultat.error);
        return;
      }

      ecrire("ml-call", resultat.ml_call);
      ecrire("ml-put", resultat.ml_put);
      ecrire("ml-bs-call", resultat.bs_call);
      ecrire("ml-bs-put", resultat.bs_put);
    }


    // ================= Boutons =================

    document.getElementById("btn-ticker").addEventListener("click", chargerTicker);
    document.getElementById("btn-prix").addEventListener("click", calculerPrix);
    document.getElementById("btn-convergence").addEventListener("click", calculerConvergence);
    document.getElementById("btn-entrainer").addEventListener("click", entrainerModele);
    document.getElementById("btn-predire").addEventListener("click", predireModele);
  </script>

</body>
</html>
